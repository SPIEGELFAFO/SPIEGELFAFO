<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPIEGEL Pro Cat</title> 
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;700;900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-red: #da4326;
            --bg-dark: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #e0e0e0;
            --input-border: #444444;
            --btn-gray: #4d4d4d;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        /* --- Header Styles --- */
        header {
            background-color: var(--brand-red);
            /* The background stretches full width, but the container controls the content */
        }

        .header-container {
            max-width: 1000px; /* This creates that standard vertical alignment */
            margin: 0 auto;    /* Centers the container */
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Roboto Slab', serif;
            font-size: 26px;
            font-weight: 900;
            color: #ffffff;
            text-decoration: none;
            letter-spacing: 0.5px;
        }

        .logo span {
            font-weight: 400;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .github-link {
            color: #ffffff;
            text-decoration: underline;
            font-weight: 700;
            font-size: 13px;
        }

        .add-post-btn {
            background-color: #ffffff;
            color: var(--brand-red);
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 6px;
            border-radius: 2px;
        }

        .add-post-btn svg {
            width: 10px;
            height: 10px;
            fill: var(--brand-red);
        }

        /* --- Main Content Styles --- */
        main {
            max-width: 800px; /* Constrains the text area */
            margin: 60px auto;
            text-align: center;
            padding: 0 20px;
        }

        .pre-title {
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 12px;
        }

        h1 {
            font-family: 'Roboto Slab', serif;
            font-size: 46px;
            font-weight: 700;
            line-height: 1.15;
            margin: 0 0 24px 0;
        }

        .description {
            font-size: 18px;
            line-height: 1.5;
            color: var(--text-muted);
            margin-bottom: 48px;
            padding: 0 10px;
        }

        /* --- Search Section Styles --- */
        .search-section {
            max-width: 650px;
            margin: 0 auto;
        }

        .search-label {
            display: block;
            margin-bottom: 12px;
            font-size: 15px;
        }

        .search-form {
            display: flex;
            height: 44px;
        }

        .search-input {
            flex-grow: 1;
            background-color: transparent;
            border: 1px solid var(--input-border);
            color: var(--text-main);
            padding: 0 16px;
            font-size: 14px;
            outline: none;
        }

        .search-input::placeholder {
            color: #888888;
        }

        .search-input:focus {
            border-color: #666666;
        }

        .search-submit {
            background-color: var(--btn-gray);
            color: #aaaaaa;
            border: none;
            padding: 0 24px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <a href="#" class="logo">SPIEGEL <span>Pro Cat</span></a>
            <div class="header-actions">
                <a href="#" class="github-link">Github</a>
                <a href="#" class="add-post-btn">
                    Add Post
                    <svg viewBox="0 0 320 512" xmlns="http://www.w3.org/2000/svg">
                        <path d="M278.6 233.4c12.5 12.5 12.5 32.8 0 45.3l-160 160c-12.5 12.5-32.8 12.5-45.3 0s-12.5-32.8 0-45.3L210.7 256 73.4 118.6c-12.5-12.5-12.5-32.8 0-45.3s32.8-12.5 45.3 0l160 160z"/>
                    </svg>
                </a>
            </div>
        </div>
    </header>

    <main>
        <div class="pre-title">Interactive Research Tool for Cat past</div>
        
        <h1>What Your Family Did Under<br>Tom – Find Out Here</h1>
        
        <p class="description">
            SPIEGEL Pro Cat is a community-driven wiki to establish a public database with a file<br>
            on every puss in the world who has made social media posts in favor of Tom's government.
        </p>

        <div class="search-section">
            <label class="search-label" for="search-input">Search here by name</label>
            <form class="search-form" onsubmit="event.preventDefault();">
                <input type="text" id="search-input" class="search-input" placeholder="e.g. Shapiro">
                <button type="submit" class="search-submit">Search</button>
            </form>
        </div>
    </main>

</body>
</html>
