<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;700;900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ "styles.css" | relURL }}">
    <script>
      window.SEARCH_INDEX_URL = "{{ "index.json" | relURL }}";
    </script>
    <script defer src="{{ "search.js" | relURL }}"></script>
</head>
<body>
    <header>
        <div class="header-container">
            <a href="{{ "/" | relURL }}" class="logo">SPIEGEL <span>Pro Cat</span></a>
            <div class="header-actions">
                {{ if .IsHome }}
                  <a href="https://github.com/" target="_blank" rel="noopener noreferrer" class="github-link">GitHub</a>
                  <a href="#" class="add-post-btn">
                      Add Post
                      <svg viewBox="0 0 320 512" xmlns="http://www.w3.org/2000/svg">
                          <path d="M278.6 233.4c12.5 12.5 12.5 32.8 0 45.3l-160 160c-12.5 12.5-32.8 12.5-45.3 0s-12.5-32.8 0-45.3L210.7 256 73.4 118.6c-12.5 12.5-12.5 32.8 0-45.3s32.8-12.5 45.3 0l160 160z"/>
                      </svg>
                  </a>
                {{ else }}
                  <div class="header-search-wrap">
                      <form class="header-search-form" onsubmit="event.preventDefault();">
                          <input type="text" id="header-search-input" class="search-input live-search-input" data-results="header-search-results" placeholder="Search archive" autocomplete="off">
                          <button type="submit" class="search-submit">Search</button>
                      </form>
                      <div id="header-search-results" class="search-results header-search-results"></div>
                  </div>
                {{ end }}
            </div>
        </div>
    </header>

    <main>
        <div class="page-shell">
            {{ block "main" . }}{{ end }}
        </div>
    </main>
</body>
</html>
